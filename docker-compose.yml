# Local-first setup: SQLite in a named volume, UI on http://localhost:8080.
# For PostgreSQL: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d
name: timeos

services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TIMEOS_DATABASE_URL: ${TIMEOS_DATABASE_URL:-sqlite:////app/data/timeos.db}
    volumes:
      - timeos-data:/app/data

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Bound to localhost only: your calendar and productivity data stay on this machine.
      - "127.0.0.1:${TIMEOS_PORT:-8080}:80"

volumes:
  timeos-data:

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: timeos
          POSTGRES_PASSWORD: timeos
          POSTGRES_DB: timeos_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U timeos -d timeos_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.17"
          python-version: "3.12"
      - run: uv sync --frozen --extra postgres
      - run: uv run --frozen --extra postgres ruff check .
      - run: uv run --frozen --extra postgres ruff format --check .
      - name: Tests
        env:
          TIMEOS_TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql+psycopg://timeos:timeos@localhost:5432/timeos_test' || '' }}
        run: uv run --frozen --extra postgres pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: POSTGRES_PASSWORD=ci docker compose -f docker-compose.yml -f docker-compose.postgres.yml config --quiet
      - run: docker compose build
